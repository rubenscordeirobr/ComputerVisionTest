services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"          # RTSP (the .NET app publishes annotated streams here)
      - "8888:8888"          # HLS  (http://localhost:8888/annotated/{cam}/index.m3u8)
      - "8889:8889"          # WebRTC HTTP / WHEP (http://localhost:8889/annotated/{cam}/whep)
      - "8189:8189/udp"      # WebRTC media (ICE/UDP)
      - "9997:9997"          # MediaMTX API (optional, handy for debugging)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
