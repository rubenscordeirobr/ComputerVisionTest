services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"          # RTSP (the .NET app publishes annotated streams here)
      - "8888:8888"          # HLS  (http://localhost:8888/annotated/{cam}/index.m3u8)
      - "8889:8889"          # WebRTC HTTP / WHEP (http://localhost:8889/annotated/{cam}/whep)
      - "8189:8189/udp"      # WebRTC media (ICE/UDP)
      - "9997:9997"          # MediaMTX API (optional, handy for debugging)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml

  # HTTPS reverse proxy for the *.vemlogo.com sites, all sharing port 8443
  # (80/443 belong to other services on this host). Certificates via Porkbun
  # DNS-01 — put the API credentials in ./.env (PORKBUN_API_KEY /
  # PORKBUN_API_SECRET, gitignored).
  caddy:
    build: ./caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8443:8443/udp"    # HTTP/3
    environment:
      - PORKBUN_API_KEY=${PORKBUN_API_KEY:-}
      - PORKBUN_API_SECRET=${PORKBUN_API_SECRET:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./client:/srv/client:ro    # served at view-camera.vemlogo.com
      - caddy_data:/data
      - caddy_config:/config

  # WhatsApp gateway (unofficial API via Baileys). The web app pairs a number by
  # QR code on the Sistema page; alerts are sent through POST /message/send*.
  # AUTHENTICATION_API_KEY must match the "API Key" field in system settings.
  # Inbound messages (the command agent, SPEC-17) use a per-instance webhook
  # registered from the same page ("Registrar webhook"), pointing at the API on
  # this host: http://host.docker.internal:5220/api/whatsapp/webhook. No
  # WEBHOOK_GLOBAL_* variables are needed.
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=cameravision-evolution-key
      - LANGUAGE=pt-BR
      - CONFIG_SESSION_PHONE_CLIENT=CameraVision
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_LABELS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:15
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

volumes:
  caddy_data:
  caddy_config:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
